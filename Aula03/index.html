<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <center><h1>Formulario de Cadastro</h1></center>
    <p style="font-family: SF-Pro;font-size: 30px; color:darkmagenta; font-weight: 700;">Realize o cadastro e concorra a premios!</p>
    <form>
        <label>Nome Completo</label>
        <input type="text" placeholder="Insira seu nome completo" required />
        <br><br>
        <label>Data de nascimento</label>
        <input type = "date"/>
        <br><br>
        <label>CPF</label>
        <input type="number"/>
        <br><br>
        <label>Voce nos indicaria?</label>
        <input type = "number" min="0" max="5"/>
        <br><br>
        <label>E-mail</label>
        <input type="email" placeholder="Insira seu e-mail" required />
        <br><br>
        <label>Cor Favorita</label>
        <input type="color" />
        <br><br>
        <label>em qual volume você ouve música (0-100)?</label>
        <input id="volume" type="range" min="0" max="100" value="50"
        oninput="atualizarVolume(this.value)" />
        <span id="valor-volume">50</span>
        <br><br>
        <fieldset>
         <legend>Gênero</legend>
         <input type="radio" name = "genero"/>
         <label>Masculino</label>
         <input type="radio" name = "genero"/>
         <label>Feminino</label>   
        </fieldset>
        <br><br>
        <fieldset>
            <legend>Monte seu Lanche! 🍔</legend>
            <input type="checkbox" name = "salada"/>
            <label>Salada</label>
            <input type="checkbox" name = "queijo"/>
            <label>Queijo</label>
            <input type="checkbox" name = "bacon"/>
            <label>Bacon</label>
            <input type="checkbox" name = "hamborgue"/>
            <label>Hambúrguer</label>
            <input type="checkbox" name = "molho"/>
            <label>Molho da Casa</label>
        </fieldset>
    </form>
    <br><br>
    <label>Informações Adicionais></label>
    <textarea id="info"></textarea>
    <br><br>
    <label>Senha</label>
    <input type="password" placeholder="Insira sua senha" required />
    <br><br>
    <label>Informe sua Cidade</label>
    <select>
        <option>Jaguariúna</option>
        <option>Amparo</option>
        <option>Pedreira</option>
        <option>Serra Negra</option>
    </select>
    <br><br>
    <input type="reset" value="Limpar Formulário" />
    <input type=""submit" />
<script>
    function atualizarVolume(valor){
        document.getElementById('valor-volume').textContent = valor;
    }
</script>
</body>
</html>
